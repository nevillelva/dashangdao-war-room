# ==============================================================================
# 54088 戰情室 — 券商分點分批排程（獨立檔案）
# ------------------------------------------------------------------------------
# 放到你的 repo：.github/workflows/broker_flows_scheduler.yml
#
# 【R98續113新增，總指揮官反映「9:30三關查詢常常收盤後才顯示」查證後拆出】
# 根因：原本這19條券商分點cron(約50次觸發/日)跟其餘所有階段(包含09:24/
# 09:29這種時間敏感的自建5分K三關輪詢)全部擠在同一個workflow檔案
# (system_scheduler.yml)裡。直接查Supabase system_run_log證實：
#   2026-09-08 intraday_gate 10:00:30（準時）
#   2026-09-07 intraday_gate 14:21:04（延遲近5小時，市場都收盤了）
#   2026-08-31 intraday_gate 15:05:36（延遲）
#   2026-08-28 intraday_gate 20:58:04（延遲超過11小時）
#   2026-08-20 intraday_gate 00:21:07（延遲到隔天凌晨）
# 同一個workflow檔案裡cron觸發次數越多，GitHub Actions排程佇列高負載時
# 越容易延遲或跳過其中幾條（GitHub官方文件承認的已知限制）——這19條
# 券商分點cron是全部cron裡數量最多、且對時間精準度要求最低的一組(反正是
# 分批斷點續傳，晚幾分鐘觸發不影響正確性)，最適合獨立出來，把
# system_scheduler.yml留給真正對時間敏感的階段(尤其09:24/09:29三關輪詢)，
# 減少排隊壅塞的機率。
#
# 這裡執行的邏輯(stage_broker_flows())完全沒有改變，只是觸發來源從「跟
# 其他50+條cron擠在同一個workflow檔案」改成「自己獨立一個檔案」。
# 網頁版「補跑今日券商分點」按鈕仍然呼叫system_scheduler.yml的
# workflow_dispatch(stage=broker_flows)，不受這次拆分影響，那條路徑
# 沒有變。
#
# 需要的secrets跟system_scheduler.yml共用同一組（同一個repo設定一次即可）：
#   SUPABASE_URL, SUPABASE_KEY, FINMIND_TOKEN
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID （選填，要推播才需要）
# ==============================================================================
name: 券商分點分批排程

on:
  # 【2026-10-05 Worker V10】原生 cron 全部移除：實測 GitHub 原生 cron 延遲數小時、且與 Worker 重複觸發(第二次只會「已全數抓完」空轉)。
  # 券商分點改由 Cloudflare Worker 在「當晚」台北 19:20(主)/20:40(備援) 派發 system_scheduler.yml 的 stage=broker_flows，
  # 兩次都在 22:00 選股前完成；取消「隔天 08:10」。要立刻補抓請用網頁「補跑今日券商分點」或手動觸發本檔。
  workflow_dispatch:   # 方便手動測試這個獨立檔案本身有沒有正常運作

jobs:
  run-broker-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 【2026-10-05 新增】快速閘門：最近 4 小時內若已記錄「券商分點來源全數不可用」
      # (source_unavailable，例如 FinMind 帳號不是 Sponsor 又擋掉 HiStock)，排程觸發就整套略過，
      # 不再安裝套件白跑，省下 Actions 分鐘。手動觸發(workflow_dispatch)永遠照跑，方便續訂後立刻補抓。
      - name: 快速閘門
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          SINCE=$(date -u -d '4 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          N=$(curl -s -m 20 -G "$SUPABASE_URL/rest/v1/system_run_log" \
                -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
                --data-urlencode "select=id" --data-urlencode "stage=eq.broker_flows" \
                --data-urlencode "gate_status=eq.source_unavailable" \
                --data-urlencode "created_at=gte.$SINCE" --data-urlencode "limit=1" \
              | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
          echo "近4小時 source_unavailable 紀錄數：$N"
          if [ "${N:-0}" -ge 1 ] 2>/dev/null; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: 設定 Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # 【2026-10-05】快取 pip 下載，縮短安裝時間(省分鐘)

      - name: 安裝套件
        if: steps.gate.outputs.skip != 'true'
        # 跟system_scheduler.yml用同一份安裝清單——system_scheduler.py會
        # import warroom_core.py，該檔案頂層無條件import yfinance/openai/
        # shioaji，就算這裡只跑broker_flows這個階段，還是要裝全部，否則
        # import階段就會ModuleNotFoundError，程式根本起不來。
        run: pip install supabase yfinance requests pandas numpy openai shioaji

      - name: 執行券商分點分批抓取
        if: steps.gate.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BROKER_FLOWS_BATCH_SIZE: 30
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "獨立券商分點排程檔案觸發，固定執行 broker_flows 階段。"
          python system_scheduler.py --stage broker_flows
