name: 手動-探測台股休市日曆來源

# 唯讀：查證證交所/FinMind 的休市日曆是否涵蓋整年（含未來日期）。結果存進 Supabase 私有表。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: 探測並存入 Supabase
        env:
          FM: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python probe_tw_calendar.py
