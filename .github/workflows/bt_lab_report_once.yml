name: 一次性-自助回測引擎跑戰卡≥6報告

# 讀 bt_dataset（5 年面板）→ bt_lab 引擎 → 結果只寫私有表 ui_selftest_reports(summary='bt_lab_first_cross_ge6')。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase pandas numpy
      - name: 跑報告
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bt_lab_report.py
