name: 手動-停損寬度×族群×大盤多空／寬度門檻×策略回測（結果只寫私有 Supabase）

# 唯讀：不下單、不改任何正式規則預設值、不寫正式資料表、不推公開分支、不上傳 artifact。
# 結果寫入 ui_selftest_reports(summary='stoploss_gate_bt[:tag]')。公開 repo 的日誌只印事件數量，細節只存私有表。
# 還原價為主（auto_adjust=True），未還原顯示價（auto_adjust=False）只做對照。來回成本預設 0.585%（手續費無折扣＋證交稅 0.3%）。
on:
  workflow_dispatch:
    inputs:
      n:
        description: '母體檔數（成交值前 N 大）'
        required: false
        default: '900'
        type: string
      years:
        description: '下載年數（含約 1 年暖機；判定約 5 年）'
        required: false
        default: '6'
        type: string
      min_sector:
        description: '族群最少檔數（不足者併入小族群）'
        required: false
        default: '12'
        type: string
      fee_discount:
        description: '手續費折扣（1.0＝無折扣，保守）'
        required: false
        default: '1.0'
        type: string
      slippage_pct:
        description: '單邊滑價（%，預設 0）'
        required: false
        default: '0'
        type: string
      tag:
        description: '報告標籤'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "supabase~=2.34.1" "pandas~=2.3.3" "numpy~=2.4.6" "yfinance~=1.8.0" "requests~=2.34.2"
      - name: 還原資料快取（日K 還原價／未還原價抓過的不重抓；快取只有本倉庫協作者可讀）
        uses: actions/cache/restore@v4
        with:
          path: btcache
          key: bt-data-${{ github.run_id }}
          restore-keys: |
            bt-data-
      - name: 回測快取：從 Supabase Storage 合併回本地（永久備份；較新的本地檔保留）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: python bt_cache_store.py pull btcache
      - name: 執行停損寬度／寬度門檻回測
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          BT_N: ${{ github.event.inputs.n }}
          BT_YEARS: ${{ github.event.inputs.years }}
          BT_MIN_SECTOR: ${{ github.event.inputs.min_sector }}
          BT_FEE_DISCOUNT: ${{ github.event.inputs.fee_discount }}
          BT_SLIPPAGE_PCT: ${{ github.event.inputs.slippage_pct }}
          BT_TAG: ${{ github.event.inputs.tag }}
        run: python stoploss_gate_bt_run.py
      - name: 存資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: btcache
          key: bt-data-${{ github.run_id }}
      - name: 回測快取：備份到 Supabase Storage（私有 bucket；失敗不影響後備）
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: python bt_cache_store.py push btcache
