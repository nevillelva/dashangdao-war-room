name: 手動-資料庫保留期清理（先匯出到 Storage 再刪除）

# 2026-11-15：預設乾跑（只印計畫，不連線、不刪除）。
# 真正刪除需同時：execute=true、confirm 欄位輸入 I_HAVE_EXPORTED。流程（db_retention.py --execute）：
#   逐表 匯出到 Supabase Storage 私有 bucket（Parquet、分片、sha256 回讀校驗）→ 刪除前再對帳列數 → 才刪除；
#   任一步失敗該表不動。備份表（backup_*）只匯出並校驗、本流程不 DROP 任何表（已移除刪表 RPC）；
#   備份表由使用者自行在 Supabase SQL 編輯器手動 DROP（SQL 見專案文件「資料庫保留方案_DB_RETENTION_20261115」）。
# 沒有排程觸發：只有手動執行。
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "true = 真的處理（需同時填 confirm）；預設 false = 乾跑"
        type: boolean
        default: false
      confirm:
        description: "execute=true 時必須輸入 I_HAVE_EXPORTED"
        required: false
        default: ""
        type: string
      tables:
        description: "只處理這些表（逗號分隔，留空=全部執行清單）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: db-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install "supabase~=2.34.1" "requests~=2.34.2"
      - name: 乾跑（永遠先跑）
        env:
          TABLES: ${{ inputs.tables }}
        run: python db_retention.py ${TABLES:+--tables "$TABLES"}
      - name: 真的處理（需 execute=true 且 confirm 正確）
        if: ${{ inputs.execute && inputs.confirm == 'I_HAVE_EXPORTED' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
          RETENTION_CONFIRM: ${{ inputs.confirm }}
          TABLES: ${{ inputs.tables }}
        run: python db_retention.py --execute ${TABLES:+--tables "$TABLES"}
