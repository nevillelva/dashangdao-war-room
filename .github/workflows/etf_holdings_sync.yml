name: ETF持股與規模同步

# 原每個交易日 19:50(台灣) 同步元大、復華、MoneyDJ；2026-10-12 起三個來源皆因條款停用，排程取消，只保留手動觸發。
# 寫入 etf_holdings / etf_master(aum_*、holdings_*)；只寫 ETF 專用表，不動任何交易資料。
on:
  # 【2026-10-12】每日排程停用：元大、復華、MoneyDJ 條款皆不允許未授權自動取用／重製（見 etf_holdings.py）。保留手動觸發。
  workflow_dispatch:
    inputs:
      full:
        description: '強制重抓所有 ETF 的 MoneyDJ 持股'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件與瀏覽器
        run: |
          pip install supabase requests pandas openpyxl beautifulsoup4 lxml playwright
          playwright install --with-deps chromium
      - name: 同步
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then python etf_holdings.py --full; else python etf_holdings.py; fi
