name: 手動-營收動能5年回測（結果只寫私有 Supabase）

# 唯讀：不寫正式資料表、不推公開分支、不上傳 artifact。結果寫入 ui_selftest_reports(summary='backtest_revenue[:tag]')。
# 公開 repo 的 Actions 日誌任何人都看得到，所以日誌只印一行精簡統計（不含個股／策略細節）。
on:
  workflow_dispatch:
    inputs:
      n:
        description: '母體檔數（成交值前 N 大）'
        required: false
        default: '600'
        type: string
      years:
        description: '價格資料年數'
        required: false
        default: '5'
        type: string
      tag:
        description: '報告標籤'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "supabase~=2.34.1" "pandas~=2.3.3" "numpy~=2.4.6" "yfinance~=1.8.0" "requests~=2.34.2"
      - name: 還原資料快取（FinMind 有每小時額度，抓過的不重抓；快取只有本倉庫協作者可讀）
        uses: actions/cache/restore@v4
        with:
          path: bt_cache
          key: bt-data-${{ github.run_id }}
          restore-keys: |
            bt-data-
      - name: 回測快取：從 Supabase Storage 合併回本地（永久備份；較新的本地檔保留）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: python bt_cache_store.py pull bt_cache
      - name: 執行營收動能回測
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          BT_N: ${{ github.event.inputs.n }}
          BT_YEARS: ${{ github.event.inputs.years }}
          BT_TAG: ${{ github.event.inputs.tag }}
          BT_CACHE: bt_cache
        run: python backtest_revenue.py
      - name: 存資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bt_cache
          key: bt-data-${{ github.run_id }}
      - name: 回測快取：備份到 Supabase Storage（私有 bucket；失敗不影響後備）
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_STORAGE_KEY: ${{ secrets.SUPABASE_STORAGE_KEY }}
        run: python bt_cache_store.py push bt_cache
