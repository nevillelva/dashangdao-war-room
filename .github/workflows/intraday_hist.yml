name: 盤中5年歷史回補與回測

# 【2026-10-17 老闆：回測以 5 年為主】永豐 1 分K 每日 500MB 額度一次抓不完 5 年 → 每晚台北 00:10（額度重置後）抓一批，
# 合成 5 分K 存在本倉庫的 Actions 快取（不公開下載、不寫進資料庫），抓完當晚就用目前已有的資料重跑全部盤中回測。
# 只查行情、不下單；結果只寫私有表 ui_selftest_reports（intraday_hist_backfill／intraday_hist_bt）；公開日誌只印數量。
on:
  schedule:
    - cron: '40 2 * * *'    # 台北 10:40（2026-10-20 查證：額度 06:33 尚未重置、09:55 已重置 → 改到早上重置後；預留 120MB 給盤中）
    - cron: '30 18 * * *'   # 台北 02:30 補抓（額度若已重置就繼續）
    - cron: '30 19 * * 6'   # 台北週日 03:30：用目前已補到的股票重跑多時點組合回測（2026-10-22 母體擴到全上市，補齊前每週更新一次）
  workflow_dispatch:
    inputs:
      mode:
        description: 'both＝回補＋回測；backfill＝只回補；analyze＝只回測；c8mkt＝只跑查8盤中大盤分析；timing＝只跑盤中進場時點全網格回測；combo＝只跑多時點（09:30／11:00／12:30）組合回測'
        required: false
        default: 'both'

concurrency:
  group: intraday-hist
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase yfinance requests pandas numpy openai shioaji pypdf
      - name: 取回快取
        uses: actions/cache/restore@v4
        with:
          path: ihist
          key: intraday-hist-v1-${{ github.run_id }}
          restore-keys: intraday-hist-v1-
      - name: 回補（永豐）
        if: github.event.inputs.mode != 'analyze' && github.event.inputs.mode != 'c8mkt' && github.event.inputs.mode != 'timing' && github.event.inputs.mode != 'combo' && github.event.schedule != '30 19 * * 6'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          IHIST_DIR: ihist
        run: |
          set -o pipefail
          python -u system_scheduler.py --stage intraday_hist_backfill 2>&1 | sed -u -E 's/(^|[^A-Za-z0-9])[A-Z][12][0-9]{8}([^0-9]|$)/\1[已遮蔽ID]\2/g' | grep -E "^\[盤中5年" || true
      - name: 存回快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ihist
          key: intraday-hist-v1-${{ github.run_id }}
      - name: 查8 盤中大盤分析（讀快取）
        if: github.event.inputs.mode == 'c8mkt'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          IHIST_DIR: ihist
        run: |
          set -o pipefail
          python -u system_scheduler.py --stage c8_intraday_mkt 2>&1 | grep -E "^\[盤中5年|^\[查8盤中大盤" || true
      - name: 取回回測資料快取（日K、FinMind；時點／組合回測用）
        if: github.event.inputs.mode == 'timing' || github.event.inputs.mode == 'combo' || github.event.schedule == '30 19 * * 6'
        uses: actions/cache/restore@v4
        with:
          path: btcache
          key: bt-cache-v1-cmd_deep_backtest-${{ github.run_id }}
          restore-keys: bt-cache-v1-cmd_deep_backtest-
      - name: 盤中進場時點全網格回測（讀快取）
        if: github.event.inputs.mode == 'timing'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          IHIST_DIR: ihist
        run: |
          set -o pipefail
          python -u system_scheduler.py --stage intraday_timing_bt 2>&1 | grep -E "^\[盤中5年|^\[盤中時點回測" || true
      - name: 多時點組合回測（09:30／11:00／12:30 × 進場時點 × 出場；讀快取）
        if: github.event.inputs.mode == 'combo' || github.event.schedule == '30 19 * * 6'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          IHIST_DIR: ihist
        run: |
          set -o pipefail
          python -u system_scheduler.py --stage intraday_combo_bt 2>&1 | grep -E "^\[盤中5年|^\[多時點組合回測" || true
      - name: 回測（讀快取）
        if: github.event.inputs.mode != 'backfill' && github.event.inputs.mode != 'c8mkt' && github.event.inputs.mode != 'timing' && github.event.inputs.mode != 'combo' && github.event.schedule != '30 19 * * 6'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          IHIST_DIR: ihist
        run: |
          set -o pipefail
          python -u system_scheduler.py --stage intraday_hist_analyze 2>&1 | grep -E "^\[盤中5年" || true
      - name: 清掉舊快取（只留最新 2 份）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/caches?key=intraday-hist-v1-&per_page=100" --jq '.actions_caches | sort_by(.created_at) | reverse | .[2:] | .[].id' | while read id; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
