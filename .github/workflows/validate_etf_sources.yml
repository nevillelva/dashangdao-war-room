name: 手動-ETF配息資料來源驗證

# 唯讀：只查詢 FinMind / yfinance / 證交所與櫃買 OpenAPI，產出驗證報告，不寫任何正式資料表。
# 手動觸發。通過門檻寫在 validate_etf_sources.py 開頭（事先固定，不看結果再調整）。

on:
  workflow_dispatch:
    inputs:
      max:
        description: '只驗證前N檔ETF（0=全部）'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests yfinance pandas

      - name: 執行驗證
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ETF_MAX: ${{ github.event.inputs.max }}
        run: |
          set -o pipefail
          python validate_etf_sources.py 2>&1 | tee run.log

      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-validation-report
          path: etf_validation_out/
          if-no-files-found: warn

      - name: 發佈報告到 reports-etf 分支（讓報告可直接在 repo 內讀取，不必下載 Artifact）
        if: always()
        run: |
          rm -rf pub
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone --depth 1 --branch reports-etf "$URL" pub 2>/dev/null || (mkdir pub && cd pub && git init -q -b reports-etf && git remote add origin "$URL")
          mkdir -p pub/latest
          rm -f pub/latest/*
          cp -r etf_validation_out/* pub/latest/ 2>/dev/null || true
          cp run.log pub/latest/run.log 2>/dev/null || true
          cd pub
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "report ${{ github.run_id }}" || echo "no changes"
          git push origin reports-etf
