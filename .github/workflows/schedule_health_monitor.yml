# ==============================================================================
# 排程健康監控（R98續51新增，R98續54全面升級，總指揮官指示：
# 要落實到「全部系統已有排程的地方」，且偵測到問題要能精準補跑）
# ------------------------------------------------------------------------------
# 【背景】2026-08-31發生cron自動排程完全停擺超過7.5小時的事件，總指揮官
# 自己截圖發現的，系統本身完全沒有察覺、沒有任何警訊。
#
# 【R98續54重新設計，回應總指揮官「每個排程點都要能確認沒失效」的要求】
# 總指揮官原本提議「每個排程點前5分鐘各自做一次確認」——這個方向是對的
# (快速偵測)，但字面上的做法有結構性矛盾：如果GitHub的cron機制本身可能
# 失效(這正是這次事故的根因)，那麼新增48個「確認用」cron，跟它們要確認
# 的對象一樣，也可能被同樣的congestion問題影響而不觸發，不是真正解決
# 可靠性問題，只是把同一個風險複製48份，還會讓總排程數從48暴增到96，
# 統計上「至少一個失敗」的機率反而更高。
#
# 改用等效但更穩健的做法：①頻率從每2小時提高到每15分鐘，不管哪個排程點
# 出問題，最多15分鐘內就會被偵測到，效果上等同於「每個排程點都有近乎
# 即時的確認」，但只需要一個高頻率監控，不會讓整體複雜度同步上升
# ②checkout repo動態解析system_scheduler.yml的完整cron→stage對照表
# (不是寫死複製一份，避免主排程改了這裡忘記同步跟著漏掉)，用croniter
# 精算每個排程「上一次應該觸發的時間點」，逐一比對system_run_log有沒有
# 在合理時間窗口內的對應紀錄，找出真正「漏跑」的stage③找到漏跑的
# stage，全部依序補跑(去重，同一個stage不重複觸發)，不是只補一個代表
# 性的——這才是真正「精準對照空窗期漏了什麼」的補救，不是意思意思補一下。
#
# 【設計原則：獨立性維持】不呼叫system_scheduler.py的dispatch邏輯本身，
# 只是讀取它的yaml設定檔案來知道「應該有哪些排程」，降低共同故障風險。
#
# 【誠實的技術限制】自動補救需要REPO_PAT這個secret(內容是有repo+workflow
# 權限的PAT，不能用內建GITHUB_TOKEN，GitHub官方封鎖鏈式觸發防遞迴)——
# 總指揮官已於2026-08-31設定完成。
# ==============================================================================

name: 排程健康監控

on:
  schedule:
    # 【R98續54】頻率從每2小時提高到每15分鐘，達到「每個排程點都能在
    # 合理時間內被確認」的效果，不用逐點各自設定確認排程。
    - cron: '*/15 * * * 1-5'
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（讀取主排程的yaml設定，動態解析cron→stage對照表）
        uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install supabase requests croniter pyyaml

      - name: 逐一比對每個排程點，找出漏跑的stage並補救
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          python3 <<'PYEOF'
          import os
          import re
          import time
          from datetime import datetime, timedelta, timezone
          from supabase import create_client
          import requests
          from croniter import croniter

          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          now = datetime.now(timezone.utc)

          with open('.github/workflows/system_scheduler.yml', encoding='utf-8') as f:
              yaml_text = f.read()

          cron_exprs = re.findall(r"cron: '([^']+)'", yaml_text)
          case_map = dict(re.findall(r'"([^"]+)"\)\s*STAGE="([^"]+)"', yaml_text))

          schedule_pairs = []
          for expr in cron_exprs:
              stage = case_map.get(expr)
              if stage:
                  schedule_pairs.append((expr, stage))
          print(f"[排程健康監控] 解析到{len(schedule_pairs)}條有效排程對照"
                f"(共{len(cron_exprs)}條cron表達式)")

          # 【R98續125新增，總指揮官反映threshold_calibration(每月)/
          # filter_backtest(每週)被誤判「從未執行過」】根因有兩個：①這兩支
          # 排程本身原本沒寫system_run_log(已在system_scheduler.py修好)
          # ②就算寫了，這裡查詢system_run_log的since固定寫死「now-24小時」
          # ——每月/每週跑一次的排程，上次執行紀錄本來就常常落在24小時
          # 窗口外，查詢階段就已經看不到，跟排程本身有沒有跑完全無關。
          #
          # 改法：對每一條cron，用croniter連續呼叫get_prev()兩次，量出
          # 「這條排程兩次觸發之間實際間隔多久」，取全部排程裡最大的間隔
          # (通常就是每月一次的threshold_calibration)當作查詢視窗的下限，
          # 再加一些安全緩衝，一次查詢就能涵蓋所有排程的最近一次紀錄，
          # 不用每條排程各自查一次。
          _STAGE_ALIAS = {
              # 【R98續125新增】intraday_kbar這個cron觸發的stage名稱，
              # 跟它實際寫進system_run_log時用的stage名稱(intraday_gate，
              # 定義在stage_intraday_kbar()函式內部，是09:30三關輪詢
              # 完成後才寫的，用的是判斷邏輯本身的名字，不是觸發時的cron
              # 名字)兩邊從一開始命名就不一致——監控查"intraday_kbar"這個
              # stage的執行紀錄，永遠查不到，因為資料庫裡真正的紀錄叫
              # "intraday_gate"。這裡建一個對照表，查執行紀錄時用別名，
              # 不用去改stage_intraday_kbar()內部行之有年、其他地方(網頁版
              # 讀取"9:30三關查詢")也在依賴的既有stage名稱，改這裡風險
              # 最低。
              "intraday_kbar": "intraday_gate",
          }

          # 【R98續 紅燈化】時效性排程的「盤中有效視窗」分鐘數(相對排定觸發
          # 時間)。超過就代表這次已經錯過、盤都收了，補跑毫無意義——改發紅燈、
          # 不自動補跑，避免「✅已補跑」這種假象掩蓋策略其實從沒在有效時間執行。
          # 這幾個已改由 Cloudflare Worker(warroom-monitor，每5分鐘、grace 2分鐘)
          # 當主要觸發器，這裡是「連 Worker 都失效」時的最後一道紅燈backstop。
          _WINDOW_DEADLINE_MIN = {
              "overnight_flip_scan": 12,               # 13:13→13:25 下單截止
              "overnight_flip_exit_monitor": 15,       # 出場監控到 09:15
              "overnight_flip_premarket_monitor": 31,  # 盤前訂閱到 09:00(00:29→01:00)
          }

          def _interval_minutes(expr):
              """量測這條cron表達式連續兩次觸發之間間隔多少分鐘。"""
              try:
                  itr = croniter(expr, now)
                  t1 = itr.get_prev(datetime)
                  t2 = itr.get_prev(datetime)
                  return (t1 - t2).total_seconds() / 60
              except Exception:
                  return 24 * 60   # 解析失敗時保守假設是日排程

          _intervals = {expr: _interval_minutes(expr) for expr, _ in schedule_pairs}
          _max_interval = max(_intervals.values()) if _intervals else 24 * 60
          # 安全緩衝：最長間隔的1.2倍、外加3天，確保就算剛好卡在查詢邊界
          # 也不會漏看那唯一一筆紀錄。
          _lookback_hours = int(_max_interval * 1.2 / 60) + 24 * 3

          try:
              since = (now - timedelta(hours=_lookback_hours)).isoformat()
              res = (sb.table("system_run_log").select("stage,created_at")
                     .gte("created_at", since).execute())
              recent_rows = res.data or []
              print(f"[排程健康監控] 查詢視窗動態調整為過去{_lookback_hours}小時"
                    f"(依最長排程間隔{_max_interval/60:.1f}小時推算)，"
                    f"共取得{len(recent_rows)}筆紀錄。")
          except Exception as e:
              print(f"[排程健康監控] 查詢system_run_log失敗：{e}，本次無法比對，僅記錄不發警報"
                    f"(避免Supabase暫時連線問題被誤判成排程停擺)。")
              recent_rows = None

          if recent_rows is None:
              print("[排程健康監控] 略過本次檢查。")
              raise SystemExit(0)

          last_seen = {}
          for r in recent_rows:
              try:
                  t = datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
              except Exception:
                  continue
              s = r["stage"]
              if s not in last_seen or t > last_seen[s]:
                  last_seen[s] = t

          missed_stages = set()
          missed_detail = []
          expired_stages = set()   # 【紅燈化】時效性排程視窗已過、無法補救的
          expired_detail = []      # 這類跟一般漏跑分開，不補跑、改發紅燈。
          for expr, stage in schedule_pairs:
              try:
                  itr = croniter(expr, now)
                  expected_time = itr.get_prev(datetime)
                  if expected_time.tzinfo is None:
                      expected_time = expected_time.replace(tzinfo=timezone.utc)
              except Exception as e:
                  print(f"[排程健康監控] cron表達式'{expr}'解析失敗，跳過：{e}")
                  continue

              # 【R98續125新增】緩衝時間不再是每條排程一律30分鐘——這個
              # 系統實測過的排程延遲(GitHub Actions佇列壅塞)常常是以
              # 小時計，日排程給30分鐘緩衝根本不夠實際、天天誤報；但
              # 太過寬鬆(例如每20分鐘跑一次的broker_flows也給幾小時)又
              # 會讓真正的broker_flows停擺要等很久才被發現。改成依這條
              # 排程自己的間隔比例決定：間隔的25%，下限30分鐘、上限4小時。
              _interval = _intervals.get(expr, 24 * 60)
              _is_window_bound = stage in _WINDOW_DEADLINE_MIN
              if _is_window_bound:
                  # 時效性排程：緩衝=視窗deadline。超過就代表連 Cloudflare Worker
                  # (每5分鐘)＋原生cron都沒能在有效時間內把它跑起來，補跑無意義。
                  buffer_minutes = _WINDOW_DEADLINE_MIN[stage]
              else:
                  buffer_minutes = min(max(30, _interval * 0.25), 240)

              gap_minutes = (now - expected_time).total_seconds() / 60
              if gap_minutes < buffer_minutes:
                  continue

              _lookup_stage = _STAGE_ALIAS.get(stage, stage)
              last_run = last_seen.get(_lookup_stage)
              if last_run is None or last_run < expected_time - timedelta(minutes=buffer_minutes):
                  taipei_expected = expected_time.astimezone(timezone(timedelta(hours=8)))
                  last_run_str = "從未執行過" if last_run is None else \
                      "最近一次是" + last_run.astimezone(timezone(timedelta(hours=8))).strftime('%m-%d %H:%M')
                  if _is_window_bound:
                      if stage not in expired_stages:
                          expired_stages.add(stage)
                          _gap_past = gap_minutes - buffer_minutes
                          expired_detail.append(
                              f"{stage}（預期{taipei_expected.strftime('%H:%M')}台北，"
                              f"視窗已過{_gap_past:.0f}分鐘，{last_run_str}）")
                  elif stage not in missed_stages:
                      missed_stages.add(stage)
                      missed_detail.append(
                          f"{stage}（cron='{expr}'，預期{taipei_expected.strftime('%H:%M')}台北時間觸發，"
                          f"緩衝{buffer_minutes:.0f}分鐘，{last_run_str}）")

          remediation_lines = []
          if missed_stages:
              pat = os.environ.get("REPO_PAT")
              if pat:
                  for stage in sorted(missed_stages):
                      try:
                          resp = requests.post(
                              "https://api.github.com/repos/nevillelva/dashangdao-war-room/"
                              "actions/workflows/system_scheduler.yml/dispatches",
                              headers={"Authorization": f"Bearer {pat}",
                                      "Accept": "application/vnd.github+json"},
                              json={"ref": "main", "inputs": {"stage": stage}},
                              timeout=15)
                          if resp.status_code == 204:
                              remediation_lines.append(f"✅ 已補跑 {stage}")
                          else:
                              remediation_lines.append(f"⚠️ {stage} 補跑觸發失敗(HTTP {resp.status_code})")
                      except Exception as e:
                          remediation_lines.append(f"⚠️ {stage} 補跑觸發例外：{e}")
                      time.sleep(3)
              else:
                  remediation_lines.append("💡 尚未設定REPO_PAT，無法自動補跑，只能發警報")

          if missed_detail or expired_detail:
              _sections = ["🚨 [排程健康監控] 偵測到排程異常："]
              if expired_detail:
                  _expired_body = "\n".join(f"・{d}" for d in expired_detail)
                  _sections.append(
                      f"\n🔴 時效性排程已錯過、無法補救（{len(expired_stages)}個）——"
                      f"盤中有效視窗已過，補跑沒有意義，故不自動補跑：\n"
                      + _expired_body
                      + "\n（正常情況下這些由 Cloudflare Worker 準時觸發；持續紅燈"
                        "代表連 Worker 都沒守住，請人工確認 warroom-monitor 是否還活著。）")
              if missed_detail:
                  _missed_body = "\n".join(f"・{d}" for d in missed_detail)
                  _remed_body = "\n".join(remediation_lines)
                  _sections.append(
                      f"\n🟡 一般排程可能漏跑（{len(missed_stages)}個），已自動補跑：\n"
                      + _missed_body + "\n\n補救結果：\n" + _remed_body)
              alert_msg = "\n".join(_sections)
              print(alert_msg)
              token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")
              if token and chat_id:
                  try:
                      requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                                   json={"chat_id": chat_id, "text": alert_msg}, timeout=10)
                  except Exception as e:
                      print(f"[排程健康監控] Telegram推播失敗：{e}")
          else:
              print(f"[排程健康監控] 正常，{len(schedule_pairs)}條排程逐一比對皆無漏跑。")

          # 【R98續59新增，總指揮官指示：不接受「監控本身也可能失效」這個
          # 風險，要真正降到最低】上面這些檢查邏輯，全部都跑在GitHub
          # Actions上——如果GitHub Actions的cron觸發機制本身完全停擺
          # (這正是這次事故的根因)，這支健康監控workflow自己也會一起
          # 停擺，沒有任何東西能發現「連監控都停了」。

          # 解法：用healthchecks.io這類「死人開關」(dead man's switch)
          # 服務——完全獨立於GitHub Actions的第三方基礎設施，運作邏輯
          # 反過來：不是「主動去檢查」，是我們定期主動回報「我還活著」，
          # 太久沒收到回報，它就主動發警報。因為故障原因完全不相關
          # (GitHub congestion問題不會連帶影響healthchecks.io)，「兩者
          # 同時失效」的機率大幅降低，這是目前能做到最完善的雙重保險。
          # 這裡每次健康監控自己成功跑完(不管有沒有發現排程漏跑)，都會
          # ping一次——沒有設定HEALTHCHECKS_PING_URL這個secret時優雅
          # 跳過，不影響上面的核心檢查邏輯。
          ping_url = os.environ.get("HEALTHCHECKS_PING_URL")
          if ping_url:
              try:
                  requests.get(ping_url, timeout=10)
                  print("[排程健康監控] 已向healthchecks.io回報存活。")
              except Exception as e:
                  print(f"[排程健康監控] healthchecks.io ping失敗(不影響上面的檢查結果)：{e}")
          else:
              print("[排程健康監控] 尚未設定HEALTHCHECKS_PING_URL，跳過死人開關回報"
                    "（這代表目前還沒有「監控背後的監控」，仍有本文件開頭提到的風險）。")
          PYEOF
