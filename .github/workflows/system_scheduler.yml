# ==============================================================================
# 54088 戰情室 — 系統自主選股排程 (GitHub Actions)
# ------------------------------------------------------------------------------
# 放到你的 repo：.github/workflows/system_scheduler.yml
#
# 【V160 R43 更新】進場時機從「09:01開盤價」改成「尾盤13:15-13:25」，整個
# 排程時段表跟著重新設計：
#   22:00 台灣選股              = 14:00 UTC（不變，選股邏輯不變，但今晚選出的
#                                 candidate要等明天13:20才真正進場，不是明早）
#   08:55 台灣總經閘門(三態版)  = 00:55 UTC（不變觸發時間，但改成三態判斷：
#                                 多頭順風/對沖模式/恐慌熔斷，取代原本binary）
#   09:15 台灣早盤衝高出場檢查  = 01:15 UTC（新增，只檢查既有做多持倉是否
#                                 衝高+5%該獲利了結，不動用candidate清單）
#   13:00 台灣尾盤進場觸發      = 05:00 UTC（新增，觸發後程式自己睡到13:20
#                                 才真正動作，緩解cron本身的延遲不精準問題）
#   21:30 台灣資料源健康檢查    = 13:30 UTC（不變）
#
# 【已移除】原本09:01(01:01 UTC)的開盤價執行階段——尾盤進場後開盤跳空
# 已經不是問題，那個階段被13:00的尾盤進場取代。
#
# 注意：GitHub Actions 的 cron 不保證準點（可能延遲數分鐘），對這個用途可接受。
# 只在台灣交易日跑；非交易日腳本會因為抓不到當日資料而自然空轉，不會亂下單。
#
# 【V160 R70 新增】千張大戶自動化——R69當時查證TDCC的opendata端點測到
# smart.tdcc.com.tw這個子網域，被robots.txt擋下來，因此判定只能靠人工上傳CSV。
# 後來重新查證發現真正官方在用、社群長期自動化使用的網址是
# opendata.tdcc.com.tw（不同子網域），這個網域沒有robots.txt限制。新增
# Saturday 10:00 台灣時間（TDCC每週六早上更新資料，抓晚一點留緩衝）觸發，
# 自動抓取當週集保股權分散表、算千張大戶比例、寫進Supabase，不用再靠
# 總指揮官手動下載上傳CSV（網頁版的CSV上傳UI仍保留當備援）。
#
# 【V160 R72 新增，R96移除自動排程】券商分點自動化——查證多輪後在HiStock
# (histock.tw)找到真正乾淨的免費路徑，傳統ASP.NET伺服器端渲染，不用登入、
# 不用JS、沒有反爬蟲防護。每個交易日收盤後執行，對系統模擬倉持倉+總指揮官
# 自己的常態持倉/雷達清單抓取當日分點資料，寫進broker_flows表（跟網頁版
# CSV上傳共用）。
#
# 【R96新增，總指揮官決定】這個自動排程長期被GitHub Actions的IP擋下來，
# 幾乎每次執行都失敗（HiStock這類免費第三方頁面對雲端IP段特別敏感）。
# 總指揮官決定拿掉這個自動觸發的cron，改成純手動觸發——網頁版本來就有
# 「補跑今日券商分點」的按鈕（用你自己家用網路的IP直連，成功率高很多），
# 需要的話直接在網頁版按，不用等排程；也保留在下面workflow_dispatch的
# 手動選單裡（broker_flows仍在options清單中），要透過GitHub Actions手動
# 觸發也還是可以，只是不會再自動天天執行。
#
# 需在 repo 的 Settings → Secrets and variables → Actions 設定：
#   SUPABASE_URL, SUPABASE_KEY, FINMIND_TOKEN
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID （選填，要推播才需要）
# ==============================================================================
name: 系統自主選股排程

on:
  schedule:
    - cron: '0 14 * * 1-5'    # 週一至週五 14:00 UTC = 台灣 22:00 選股
    - cron: '55 0 * * 1-5'    # 週一至週五 00:55 UTC = 台灣 08:55 總經閘門(三態版)
    - cron: '5 1 * * 1-5'     # 週一至週五 01:05 UTC = 台灣 09:05 當沖候選池產生
                               # 【R97續7修正，見對話紀錄「候選池延遲根因排查」】
                               # 原本09:16，總指揮官實測抓到Stage2評分（FinMind
                               # 限流時）常常拖到超過09:24甚至更晚才寫完，09:24
                               # 三關輪詢那時讀到的候選池是空的，空方候選完全
                               # 進不了輪詢清單。往前移到09:05（開盤後5分鐘，
                               # 確保有基本報價可用），緩衝從原本8分鐘拉大到
                               # 19分鐘。這次會談同時修好了候選池評分本身的
                               # FinMind限流問題（改用TWSE官方批次端點），
                               # 兩個修正一起降低這個問題再發生的機率。
    - cron: '15 1 * * 1-5'    # 週一至週五 01:15 UTC = 台灣 09:15 早盤衝高出場檢查(R43新增)
    - cron: '0 5 * * 1-5'     # 週一至週五 05:00 UTC = 台灣 13:00 尾盤進場觸發(R43新增，內部會等到13:20)
    - cron: '30 13 * * 1-5'   # 週一至週五 13:30 UTC = 台灣 21:30 資料源健康檢查
    - cron: '0 2 * * 6'       # 週六 02:00 UTC = 台灣 10:00 千張大戶自動抓取(R70新增)
    # 【R96移除】原本這裡有一條 '0 9 * * 1-5'（台灣17:00 券商分點自動抓取），
    # 因為GitHub Actions連不上HiStock幾乎每次失敗，總指揮官決定拿掉自動排程，
    # 改成純手動觸發（見上方R96新增說明）。broker_flows仍保留在下方
    # workflow_dispatch選單裡，需要時可以手動選這個stage觸發。
    - cron: '30 9 * * 1-5'    # 週一至週五 09:30 UTC = 台灣 17:30 處置股/注意股+自結財報掃描(R79新增)
    - cron: '0 3 1 * *'       # 每月1號 03:00 UTC = 台灣 11:00 門檻敏感度掃描(R87新增，一個月一次)
    - cron: '0 19 * * 0'      # 週日 19:00 UTC = 台灣週一 03:00 查1~14+情報雷達每週回測校準(R95續新增，離峰時段執行)
    - cron: '24 1 * * 1-5'    # 週一至週五 01:24 UTC = 台灣 09:24 自建5分K輪詢(R95續28新增，開盤前留1分鐘緩衝，內部跑到約10:00)
    - cron: '29 1 * * 1-5'    # 週一至週五 01:29 UTC = 台灣 09:29 自建5分K輪詢備援觸發點(R97新增，總指揮官要求：09:24不能只靠單一觸發點，這是GitHub Actions排程delay時的第二道防線，內部會自我檢查09:24那次有沒有已經正常跑過，正常時直接跳過不重複執行)
    - cron: '2 2 * * 1-5'     # 週一至週五 02:02 UTC = 台灣 10:02 當沖三關自動執行(R97新增，接在5分K輪詢結束後)
    - cron: '25 5 * * 1-5'    # 週一至週五 05:25 UTC = 台灣 13:25 當沖強制平倉(R97新增，不留倉鐵律)
  workflow_dispatch:          # 允許手動觸發測試，也允許網頁版透過GitHub API遠端指定stage觸發(R81新增)
    inputs:
      stage:
        description: '要執行哪個階段（留空預設signal）'
        required: false
        default: 'signal'
        type: choice
        options:
          - signal
          - gate
          - morning_exit
          - tail_entry
          - health
          - big_holder
          - broker_flows
          - disposal_watch
          - threshold_calibration
          - filter_backtest
          - intraday_kbar
          - score_ab_compare
          - build_intraday_pool
          - intraday_execute
          - intraday_force_exit
      test_minutes:
        description: '【選填，只給intraday_kbar測試用】不想等09:24-10:00才能測，填數字（例如3）代表從現在開始跑幾分鐘就結束，不影響其他stage、也不影響正式排程行為'
        required: false
        default: ''
        type: string

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        # 【R97續4修復，總指揮官確認：真實案例，不是猜測】NVIDIA AI推演
        # 排程端每次都失敗，查證後根因是這裡的安裝清單漏了openai套件——
        # call_ai_models_parallel()用`from openai import OpenAI`呼叫
        # NVIDIA NIM(OpenAI相容API)，這裡沒裝，排程端每次呼叫都必定
        # ImportError，固定回傳「openai套件未安裝」，跟NVIDIA_API_KEY有沒有
        # 設定無關。repo的requirements.txt其實有列openai，但那份是給
        # Streamlit Cloud網頁版用的，這裡的pip install是排程獨立的安裝
        # 清單，兩邊互不相干，這裡沒有就是沒有，之前一直被漏掉。
        run: pip install supabase yfinance requests pandas numpy openai

      - name: 判斷階段並執行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INTRADAY_KBAR_TEST_MINUTES: ${{ github.event.inputs.test_minutes }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 【V160 關鍵修復】總指揮官回報：早上沒收到閘門推播、開盤執行推播裡
          # 出場清單同一檔重複兩次。根因：原本用「執行當下的實際時鐘小時」判斷
          # 要跑哪個階段，但 GitHub Actions 排程觸發本來就會延遲（官方文件明載，
          # 尖峰時段常見延遲5-30分鐘）。如果08:55的閘門排程延遲超過6分鐘、跨過
          # 整點（UTC 00:55→01:xx），小時判斷法會把它誤判成09:01的開盤執行時段，
          # 閘門推播因此消失，而且還可能跟真正的09:01執行排程前後各跑一次，
          # 導致當天執行階段跑了兩次、出場清單看起來重複。
          #
          # 改用 github.event.schedule（GitHub 官方提供的「這次到底是哪一條cron
          # 觸發的」精確字串），不管實際延遲多久，判斷永遠準確，不受延遲影響。
          #
          # 【R81新增】如果是workflow_dispatch觸發（手動點/網頁版透過API遠端
          # 觸發），github.event.schedule會是空字串，改讀github.event.inputs.stage
          # ——這樣網頁版就能指定要立即跑哪一個階段，不用等排程時間到。
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          else
            case "${{ github.event.schedule }}" in
              "0 14 * * 1-5") STAGE="signal" ;;
              "55 0 * * 1-5") STAGE="gate" ;;
              "15 1 * * 1-5") STAGE="morning_exit" ;;
              "0 5 * * 1-5")  STAGE="tail_entry" ;;
              "30 13 * * 1-5") STAGE="health" ;;
              "0 2 * * 6") STAGE="big_holder" ;;
              "30 9 * * 1-5") STAGE="disposal_watch" ;;
              "0 3 1 * *") STAGE="threshold_calibration" ;;
              "0 19 * * 0") STAGE="filter_backtest" ;;
              "24 1 * * 1-5") STAGE="intraday_kbar" ;;
              "29 1 * * 1-5") STAGE="intraday_kbar" ;;
              "5 1 * * 1-5") STAGE="build_intraday_pool" ;;
              "2 2 * * 1-5") STAGE="intraday_execute" ;;
              "25 5 * * 1-5") STAGE="intraday_force_exit" ;;
              *) STAGE="signal" ;;   # 手動觸發但沒指定stage時的保底預設值
            esac
          fi
          echo "本次由「${{ github.event.schedule }}」觸發（或手動指定stage=${{ github.event.inputs.stage }}），判斷階段：$STAGE"
          python system_scheduler.py --stage $STAGE
