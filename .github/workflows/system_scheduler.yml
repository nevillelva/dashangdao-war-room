# ==============================================================================
# 54088 戰情室 — 系統自主選股排程 (GitHub Actions)
# ------------------------------------------------------------------------------
# 放到你的 repo：.github/workflows/system_scheduler.yml
#
# 【V160 R43 更新】進場時機從「09:01開盤價」改成「尾盤13:15-13:25」，整個
# 排程時段表跟著重新設計：
#   22:00 台灣選股              = 14:00 UTC（不變，選股邏輯不變，但今晚選出的
#                                 candidate要等明天13:20才真正進場，不是明早）
#   08:55 台灣總經閘門(三態版)  = 00:55 UTC（不變觸發時間，但改成三態判斷：
#                                 多頭順風/對沖模式/恐慌熔斷，取代原本binary）
#   09:15 台灣早盤衝高出場檢查  = 01:15 UTC（新增，只檢查既有做多持倉是否
#                                 衝高+5%該獲利了結，不動用candidate清單）
#   13:00 台灣尾盤進場觸發      = 05:00 UTC（新增，觸發後程式自己睡到13:20
#                                 才真正動作，緩解cron本身的延遲不精準問題）
#   21:30 台灣資料源健康檢查    = 13:30 UTC（不變）
#
# 【已移除】原本09:01(01:01 UTC)的開盤價執行階段——尾盤進場後開盤跳空
# 已經不是問題，那個階段被13:00的尾盤進場取代。
#
# 注意：GitHub Actions 的 cron 不保證準點（可能延遲數分鐘），對這個用途可接受。
# 只在台灣交易日跑；非交易日腳本會因為抓不到當日資料而自然空轉，不會亂下單。
#
# 【V160 R70 新增】千張大戶自動化——R69當時查證TDCC的opendata端點測到
# smart.tdcc.com.tw這個子網域，被robots.txt擋下來，因此判定只能靠人工上傳CSV。
# 後來重新查證發現真正官方在用、社群長期自動化使用的網址是
# opendata.tdcc.com.tw（不同子網域），這個網域沒有robots.txt限制。新增
# Saturday 10:00 台灣時間（TDCC每週六早上更新資料，抓晚一點留緩衝）觸發，
# 自動抓取當週集保股權分散表、算千張大戶比例、寫進Supabase，不用再靠
# 總指揮官手動下載上傳CSV（網頁版的CSV上傳UI仍保留當備援）。
#
# 【V160 R72 新增，R96曾經移除自動排程，R97續25重新設計並恢復】券商分點
# 自動化——R96那時全市場~1078檔都用HiStock爬蟲抓、GitHub Actions IP長期
# 被擋，總指揮官當時決定拿掉自動cron改純手動。R97續25重新評估：現在
# fetch_branch_data_with_fallback()已經是「FinMind Sponsor分點資料優先、
# 失敗才退回HiStock」，實測驗證FinMind Sponsor在GitHub Actions這組IP上
# 確認可以正常取得資料（走正式API不是爬蟲），但額度有限，改成分批
# +斷點續傳，範圍從「只有持倉+雷達」擴大到「持倉+雷達+今日波段候選+
# 今日當沖候選+週轉率宇宙」。詳見stage_broker_flows()。
# 【R98續2】2026/08/24間隔測試證實FinMind分點額度是「穩定約47%成功率、
# 等再久也不短期回補」的結構性限制，因此時段設計改為「收盤後14:00一路
# 到隔天開盤前08:40、每20分鐘一批、盤中跳過」，大幅增加斷點續傳的補齊
# 機會(原11批→約50次觸發/日)。已查證本repo是public，GitHub Actions
# 完全免費無分鐘限制，可放心加密。
# 【R98續113移出】這19條cron本身已經搬到獨立檔案
# .github/workflows/broker_flows_scheduler.yml（查證發現這19條高頻cron
# 跟本檔案其餘階段擠在一起，是造成09:24/09:29三關輪詢常被嚴重延遲的高度
# 嫌疑對象），設計邏輯不變，只是不再出現在下面這個檔案的schedule區塊裡。
#
# 網頁版「補跑今日券商分點」按鈕仍保留當備援，一樣呼叫這個檔案(system_
# scheduler.yml)的workflow_dispatch，不受這次拆分影響。
#
# 需在 repo 的 Settings → Secrets and variables → Actions 設定：
#   SUPABASE_URL, SUPABASE_KEY, FINMIND_TOKEN
#   【R98續新增，選填】FINNHUB_TOKEN——隔夜總經/開盤前閘門SOX/TSM查詢優先
#   使用，未設定時自動退回原本yfinance(向下相容，系統不會壞掉，只是失去
#   Finnhub不受IP限流的優勢)。免費申請：https://finnhub.io/register
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID （選填，要推播才需要）
# ==============================================================================
name: 系統自主選股排程

on:
  schedule:
    # 【2026-10-05 Actions 用量控制(≤2000 分鐘/月)】原生 cron 全部移除，只保留下面這個每月一次的門檻敏感度掃描。
    # 原因：實測原生 cron 延遲 3~7 小時（準時率 0%），且與 Cloudflare Worker(warroom_monitor_worker.js V9)
    #       重複觸發，同一階段被跑兩次白耗分鐘。所有日常排程改由 Worker 的 SCHEDULE 清單準時 workflow_dispatch。
    # 還原方式：需要某個原生 cron 時，把對應 cron 行加回來即可（階段程式碼未動；git 歷史可查回原本 40 條）。
    - cron: '0 3 1 * *'       # 每月1號 03:00 UTC = 台灣 11:00 門檻敏感度掃描(R87新增，一個月一次)
  workflow_dispatch:          # 允許手動觸發測試，也允許網頁版透過GitHub API遠端指定stage觸發(R81新增)
    inputs:
      stage:
        description: '要執行哪個階段（留空預設signal）'
        required: false
        default: 'signal'
        type: choice
        options:
          - signal
          - bt_nightly
          - diag_signal_parallel
          - bundle_evening
          - bundle_late
          - overnight_scan
          - gate
          - morning_exit
          - time_stop_check
          - tail_entry
          - health
          - big_holder
          - broker_flows
          - disposal_watch
          - nightly_analysis_report
          - threshold_calibration
          - filter_backtest
          - intraday_kbar
          - score_ab_compare
          - build_intraday_pool
          - intraday_execute
          - intraday_force_exit
          - smart_money_scan
          - route2_confirm_scan
          - industry_rotation_scan
          - compute_industry_leaders
          - etf_dividend_sync
          - diag_backtest_overnight_flip
          - overnight_flip_scan
          - overnight_flip_exit_monitor
          - overnight_flip_premarket_monitor
          - backfill_shares_outstanding
          - cleanup_test_residue
          - data_health_check
          - overnight_flip_dealer_stats
          - financial_health_scan
          - mops_financial_scan
          - portfolio_value_snapshot
          - diag_mis_live
          - diag_shioaji_live
          - key_usage_monitor
          - diag_p0_signal_live
          - diag_balance_sheet_live
          - diag_historical_query_test
          - diag_finmind_balance_sheet_fields
          - mops_balance_sheet_backfill
          - mops_income_statement_backfill
          - diag_bs_backfill_symbol
          - diag_custom_quote_check
          - diag_gate1_endtoend_test
          - diag_nvidia_nim_test
          - diag_healthchecks_config
          - fix_healthchecks_schedule
          - setup_cloudflare_worker
          - deploy_cloudflare_worker
          - data_source_health_report
      backfill_shares_batch_size:
        description: '【選填，只給backfill_shares_outstanding測試用】這次最多補幾檔股本快取，留空預設150。全市場1078檔第一次補齊建議手動連續觸發幾次（每次間隔幾分鐘，避開FinMind額度冷卻期）。'
        required: false
        default: ''
        type: string
      test_minutes:
        description: '【選填，只給intraday_kbar測試用】不想等09:24-10:00才能測，填數字（例如3）代表從現在開始跑幾分鐘就結束，不影響其他stage、也不影響正式排程行為'
        required: false
        default: ''
        type: string
      diag_symbol:
        description: '【選填，只給diag_custom_quote_check測試用】要查詢的股票代號，留空預設2313'
        required: false
        default: ''
        type: string
      bt_dry_run:
        description: '【選填，只給 bt_nightly】填 1 = 乾跑（只列印訊號，不寫資料庫、不推播）'
        required: false
        default: ''
        type: string

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        # 【R97續4修復，總指揮官確認：真實案例，不是猜測】NVIDIA AI推演
        # 排程端每次都失敗，查證後根因是這裡的安裝清單漏了openai套件——
        # call_ai_models_parallel()用`from openai import OpenAI`呼叫
        # NVIDIA NIM(OpenAI相容API)，這裡沒裝，排程端每次呼叫都必定
        # ImportError，固定回傳「openai套件未安裝」，跟NVIDIA_API_KEY有沒有
        # 設定無關。repo的requirements.txt其實有列openai，但那份是給
        # Streamlit Cloud網頁版用的，這裡的pip install是排程獨立的安裝
        # 清單，兩邊互不相干，這裡沒有就是沒有，之前一直被漏掉。
        # 【R98續29同一類教訓】新增shioaji到requirements.txt(給Streamlit
        # Cloud用)時，差點忘記這裡是完全獨立的安裝清單——連動檢查抓到
        # 才補上，不然diag_shioaji_live這類排程端測試會固定ImportError。
        run: pip install supabase yfinance requests pandas numpy openai shioaji

      - name: 判斷階段並執行
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HEALTHCHECKS_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTRADAY_KBAR_TEST_MINUTES: ${{ github.event.inputs.test_minutes }}
          DIAG_SYMBOL: ${{ github.event.inputs.diag_symbol }}
          BT_DRY_RUN: ${{ github.event.inputs.bt_dry_run }}
          BACKFILL_SHARES_BATCH_SIZE: ${{ github.event.inputs.backfill_shares_batch_size }}
          BROKER_FLOWS_BATCH_SIZE: 30
          BACKFILL_BS_BATCH_SIZE: 250
          BACKFILL_IS_BATCH_SIZE: 250
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 【V160 關鍵修復】總指揮官回報：早上沒收到閘門推播、開盤執行推播裡
          # 出場清單同一檔重複兩次。根因：原本用「執行當下的實際時鐘小時」判斷
          # 要跑哪個階段，但 GitHub Actions 排程觸發本來就會延遲（官方文件明載，
          # 尖峰時段常見延遲5-30分鐘）。如果08:55的閘門排程延遲超過6分鐘、跨過
          # 整點（UTC 00:55→01:xx），小時判斷法會把它誤判成09:01的開盤執行時段，
          # 閘門推播因此消失，而且還可能跟真正的09:01執行排程前後各跑一次，
          # 導致當天執行階段跑了兩次、出場清單看起來重複。
          #
          # 改用 github.event.schedule（GitHub 官方提供的「這次到底是哪一條cron
          # 觸發的」精確字串），不管實際延遲多久，判斷永遠準確，不受延遲影響。
          #
          # 【R81新增】如果是workflow_dispatch觸發（手動點/網頁版透過API遠端
          # 觸發），github.event.schedule會是空字串，改讀github.event.inputs.stage
          # ——這樣網頁版就能指定要立即跑哪一個階段，不用等排程時間到。
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            STAGE="${{ github.event.inputs.stage }}"
          else
            case "${{ github.event.schedule }}" in
              "0 14 * * 1-5") STAGE="signal" ;;
              "15 14 * * 1-5") STAGE="overnight_scan" ;;
              "30 14 * * 1-5") STAGE="smart_money_scan" ;;
              "29 0 * * 1-5") STAGE="overnight_flip_premarket_monitor" ;;
              "55 0 * * 1-5") STAGE="gate" ;;
              "0 1 * * 1-5") STAGE="overnight_flip_exit_monitor" ;;
              "3 1 * * 1-5") STAGE="overnight_flip_exit_monitor" ;;
              "15 1 * * 1-5") STAGE="morning_exit" ;;
              "9 2 * * 1-5") STAGE="time_stop_check" ;;
              "0 5 * * 1-5")  STAGE="tail_entry" ;;
              "30 13 * * 1-5") STAGE="health" ;;
              "0 2 * * 6") STAGE="big_holder" ;;
              "30 9 * * 1-5") STAGE="disposal_watch" ;;
              "35 9 * * 1-5") STAGE="portfolio_value_snapshot" ;;
              "9 10 * * 1-5") STAGE="nightly_analysis_report" ;;
              "0 12 * * 1-5") STAGE="industry_rotation_scan" ;;
              "10 12 * * 1-5") STAGE="compute_industry_leaders" ;;
              "40 11 * * 1-5") STAGE="etf_dividend_sync" ;;
              "0 3 1 * *") STAGE="threshold_calibration" ;;
              "0 19 * * 0") STAGE="filter_backtest" ;;
              "13 1 * * 1-5") STAGE="intraday_kbar" ;;
              "18 1 * * 1-5") STAGE="intraday_kbar" ;;
              "5 1 * * 1-5") STAGE="build_intraday_pool" ;;
              "10 1 * * 1-5") STAGE="route2_confirm_scan" ;;
              "2 2 * * 1-5") STAGE="intraday_execute" ;;
              "30 2 * * 1-5") STAGE="key_usage_monitor" ;;
              "25 5 * * 1-5") STAGE="intraday_force_exit" ;;
              "13 5 * * 1-5") STAGE="overnight_flip_scan" ;;
              "16 5 * * 1-5") STAGE="overnight_flip_scan" ;;
              # 【R98續113】19條broker_flows cron分支已隨cron本體移到
              # broker_flows_scheduler.yml，這裡不再需要對應——workflow_dispatch
              # (網頁版按鈕/GitHub API手動觸發broker_flows)走的是上面
              # github.event.inputs.stage那個分支，不經過這個case，不受影響。
              "35 13 * * 1-5") STAGE="cleanup_test_residue" ;;
              "40 13 * * 1-5") STAGE="data_health_check" ;;
              "10 19 * * 0") STAGE="overnight_flip_dealer_stats" ;;
              "45 13 * * 2,5") STAGE="financial_health_scan" ;;
              "50 13 * * 2,5") STAGE="mops_financial_scan" ;;
              "3 2 * * 1-5") STAGE="mops_balance_sheet_backfill" ;;
              "3 6 * * 1-5") STAGE="mops_balance_sheet_backfill" ;;
              "3 15 * * 1-5") STAGE="mops_balance_sheet_backfill" ;;
              "9 3 * * 1-5") STAGE="mops_income_statement_backfill" ;;
              "9 7 * * 1-5") STAGE="mops_income_statement_backfill" ;;
              "9 16 * * 1-5") STAGE="mops_income_statement_backfill" ;;
              "20 19 * * 0") STAGE="data_source_health_report" ;;
              *) STAGE="signal" ;;   # 手動觸發但沒指定stage時的保底預設值
            esac
          fi
          echo "本次由「${{ github.event.schedule }}」觸發（或手動指定stage=${{ github.event.inputs.stage }}），判斷階段：$STAGE"
          python system_scheduler.py --stage $STAGE
