name: 手動-日K規則回測（均線分數/穿山惡龍/底部型態）

# 唯讀：不寫任何正式資料表，只產出報告（Artifacts + 本次執行的 Summary）。
# 手動觸發（Actions → 本工作流程 → Run workflow）。不屬於 system_scheduler.yml 的排程階段，
# 因此不需要同步修改看門狗/健康監控的排程清單。

on:
  workflow_dispatch:
    inputs:
      n:
        description: '母體檔數（近期成交值最大的N檔）'
        required: false
        default: '300'
        type: string
      years:
        description: '歷史年數'
        required: false
        default: '6'
        type: string
      only:
        description: '要跑哪些規則（r1=均線分數/常客榜, r2=穿山惡龍, r3=底部型態）'
        required: false
        default: 'r1,r2,r3'
        type: string

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install supabase pandas numpy yfinance

      - name: 執行回測
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BT_N: ${{ github.event.inputs.n }}
          BT_YEARS: ${{ github.event.inputs.years }}
          BT_ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          python backtest_rules.py 2>&1 | tee run.log

      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest_out/
          if-no-files-found: warn

      - name: 發佈報告到 reports-backtest 分支（讓報告可直接在 repo 內讀取，不必下載 Artifact）
        if: always()
        run: |
          rm -rf pub
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone --depth 1 --branch reports-backtest "$URL" pub 2>/dev/null || (mkdir pub && cd pub && git init -q -b reports-backtest && git remote add origin "$URL")
          mkdir -p pub/latest
          rm -f pub/latest/*
          cp -r backtest_out/* pub/latest/ 2>/dev/null || true
          cp run.log pub/latest/run.log 2>/dev/null || true
          cd pub
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "report ${{ github.run_id }}" || echo "no changes"
          git push origin reports-backtest
